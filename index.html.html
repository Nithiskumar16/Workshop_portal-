<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Workshop Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0a0c0f;
      font-family: 'Rajdhani', sans-serif;
      position: relative;
      overflow-x: hidden;
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,160,0,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,160,0,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem 4rem;
    }

    /* ── Header ── */
    header {
      text-align: center;
      padding: 3.5rem 2rem 2.5rem;
      border-bottom: 1px solid rgba(255,160,0,0.15);
      position: relative;
      margin-bottom: 0;
    }

    .corner { position: absolute; width: 14px; height: 14px; border-color: rgba(255,160,0,0.4); border-style: solid; }
    .corner.tl { top: 16px; left: 16px; border-width: 1px 0 0 1px; }
    .corner.tr { top: 16px; right: 16px; border-width: 1px 1px 0 0; }
    .corner.bl { bottom: -7px; left: 16px; border-width: 0 0 1px 1px; }
    .corner.br { bottom: -7px; right: 16px; border-width: 0 1px 1px 0; }

    .badge {
      display: inline-block;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 4px;
      color: #ffa000;
      background: rgba(255,160,0,0.08);
      border: 1px solid rgba(255,160,0,0.25);
      padding: 5px 16px;
      border-radius: 2px;
      margin-bottom: 1.25rem;
      text-transform: uppercase;
    }

    h1.portal-title {
      font-size: clamp(40px, 8vw, 68px);
      font-weight: 700;
      letter-spacing: 14px;
      color: #fff;
      text-transform: uppercase;
      line-height: 1;
    }

    h1.portal-title span { color: #ffa000; }

    .subtitle {
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      color: rgba(255,255,255,0.3);
      letter-spacing: 3px;
      margin-top: 0.85rem;
    }

    .accent-line {
      width: 80px;
      height: 2px;
      background: #ffa000;
      margin: 1.5rem auto 0;
    }

    /* ── Grid ── */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 16px;
      margin-top: 3rem;
    }

    /* ── Cards ── */
    .card {
      background: #0f1215;
      border: 1px solid rgba(255,160,0,0.12);
      border-radius: 4px;
      text-decoration: none;
      display: block;
      overflow: hidden;
      position: relative;
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: #ffa000;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.3s ease;
    }

    .card:hover::before { transform: scaleX(1); }

    .card:hover {
      background: #141a1f;
      border-color: rgba(255,160,0,0.45);
      transform: translateY(-3px);
    }

    .card-inner { padding: 1.75rem 1.5rem; }

    .card-num {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      color: rgba(255,160,0,0.45);
      letter-spacing: 2px;
      margin-bottom: 1rem;
    }

    .card-icon {
      width: 42px;
      height: 42px;
      background: rgba(255,160,0,0.08);
      border: 1px solid rgba(255,160,0,0.2);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      margin-bottom: 1.25rem;
    }

    .card-title {
      font-size: 17px;
      font-weight: 600;
      color: #fff;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      line-height: 1.3;
      margin-bottom: 0.5rem;
    }

    .card-desc {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      color: rgba(255,255,255,0.25);
      letter-spacing: 1px;
      margin-bottom: 1.25rem;
    }

    .card-cta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      color: #ffa000;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .card:hover .card-cta { opacity: 1; }

    .arrow {
      width: 22px;
      height: 1px;
      background: #ffa000;
      position: relative;
    }

    .arrow::after {
      content: '';
      position: absolute;
      right: 0; top: -3px;
      border: 3px solid transparent;
      border-left: 5px solid #ffa000;
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      border-top: 1px solid rgba(255,160,0,0.1);
      padding: 1.5rem 2rem;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 2px;
      margin-top: 3rem;
    }
  </style>
</head>
<body>

  <div class="grid-bg"></div>

  <header>
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="badge">Internal Portal &mdash; Staff Access</div>
    <h1 class="portal-title">WORK<span>SHOP</span></h1>
    <p class="subtitle">DATA ENTRY &amp; OPERATIONS HUB</p>
    <div class="accent-line"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
  </header>

  <div class="wrapper">
    <div class="form-grid" id="formGrid"></div>
  </div>

  <footer>
    WORKSHOP PORTAL &nbsp;&middot;&nbsp; SELECT A FORM TO OPEN IN BROWSER
  </footer>

  <script>
    const forms = [
      {
        num: "01",
        icon: "⛽",
        title: "Adblue Issued Data",
        desc: "Track adblue issue records",
        link: "YOUR_GOOGLE_FORM_LINK_HERE"
      },
      {
        num: "02",
        icon: "⚙️",
        title: "Alignment Done Data",
        desc: "Log completed alignments",
        link: "YOUR_GOOGLE_FORM_LINK_HERE"
      },
      {
        num: "03",
        icon: "🔧",
        title: "Bellcrank Work",
        desc: "Bellcrank maintenance log",
        link: "YOUR_GOOGLE_FORM_LINK_HERE"
      },
      {
        num: "04",
        icon: "🔌",
        title: "E-Greasing",
        desc: "Electronic greasing records",
        link: "YOUR_GOOGLE_FORM_LINK_HERE"
      },
      {
        num: "05",
        icon: "🛢️",
        title: "Greasing & Puncture",
        desc: "Grease application log",
        link: "YOUR_GOOGLE_FORM_LINK_HERE"
      },
      {
        num: "06",
        icon: "🔄",
        title: "Powder and Rotation",
        desc: "Powder & rotation entries",
        link: "YOUR_GOOGLE_FORM_LINK_HERE"
      },
      {
        num: "07",
        icon: "🗑️",
        title: "Scrap Tyres",
        desc: "Scrap tyre disposal data",
        link: "YOUR_GOOGLE_FORM_LINK_HERE"
      },
      {
        num: "08",
        icon: "🔩",
        title: "Tyre Fitment and Removal",
        desc: "Fitment & removal records",
        link: "YOUR_GOOGLE_FORM_LINK_HERE"
      },
      {
        num: "09",
        icon: "🚗",
        title: "Vehicle Inspection",
        desc: "Vehicle inspection records",
        link: "https://docs.google.com/forms/d/e/1FAIpQLSc04lzzEJSB60DcPGCRbjLdQr7jvqZuO2NCex6HZzjXRWdJGw/viewform?usp=dialog"
      }
    ];

    const grid = document.getElementById('formGrid');

    forms.forEach(f => {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = f.link;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.innerHTML = `
        <div class="card-inner">
          <div class="card-num">FORM — ${f.num}</div>
          <div class="card-icon">${f.icon}</div>
          <div class="card-title">${f.title}</div>
          <div class="card-desc">${f.desc}</div>
          <div class="card-cta">
            Open Form
            <div class="arrow"></div>
          </div>
        </div>
      `;
      grid.appendChild(a);
    });
  </script>

</body>
</html>
